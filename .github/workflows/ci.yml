name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Security audit S9 (2026-09-20): GITHUB_TOKEN is read-only for every job.
# Without this block a job runs with the repository's default token scopes,
# which for an org repo created before 2023 can still be read-write on
# contents, packages and pull requests. Nothing here writes to the repo —
# artifacts and step summaries need no scope — and a job that ever does asks
# for the extra scope at job level, never here.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Security Layer 1, Block 2 — the secret gates.
  #
  # Four checks that each replace a judgement somebody would otherwise have to
  # make on every pull request forever. None needs a database, a browser or a
  # build, so this job is the fastest signal in the pipeline and should stay
  # that way. The fifth secret gate — scanning the BUILT artifacts — cannot live
  # here: it runs inside the jobs that produce each bundle, further down.
  # ---------------------------------------------------------------------------
  secrets:
    name: secret gates (gitleaks, env names, history, audit)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is LOAD-BEARING, not a default worth trimming. Both
      # gitleaks and check-history-secrets.mjs read the whole object graph;
      # with the standard shallow clone they scan one commit, find nothing,
      # and report a confident green that means nothing at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependabot was removed for the deployment phase. Version updates are
      # switched on by nothing more than this file existing on main, so a
      # cherry-pick or a copied .github folder would quietly bring the weekly
      # PRs back. Re-enabling it is a decision, made by deleting this step.
      - name: No Dependabot config
        run: |
          if [ -e .github/dependabot.yml ] || [ -e .github/dependabot.yaml ]; then
            echo "::error::Dependabot config found. It was removed on purpose; see docs/security/security-layer-1.md."
            exit 1
          fi

      # The official gitleaks ACTION is deliberately not used: it requires a paid
      # GITLEAKS_LICENSE for organisation-owned repositories, and this repo is
      # org-owned. Without the licence the step fails on licensing rather than on
      # secrets — a red build that says nothing about the code. The binary itself
      # is MIT and unrestricted, so it is pinned and run directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Full history, every branch — not the working tree. A key deleted in the
      # next commit is still in the history, still in every clone, and still
      # valid until it is rotated. --redact keeps any finding out of the public
      # build log; the fingerprint is enough to locate it.
      # Config + baseline rationale: .gitleaks.toml
      - name: gitleaks (full history)
        run: gitleaks detect --source . -v --redact --log-opts="--all"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every gate in root `pnpm security`, as ONE step. Until 2026-10-01 this job
      # listed the gates one by one and had drifted: check:error-codes,
      # check:assistant-coverage, check:config-env and security:config-push were
      # in package.json and in nobody's CI, so they ran only when someone
      # remembered. A gate added to package.json now runs here with no YAML
      # change. What the chain covers (package.json `security`):
      #   security:env-names     NEXT_PUBLIC_/EXPO_PUBLIC_ names that read like secrets
      #   security:history       secret-bearing files anywhere in git history
      #   security:audit         un-waived high/critical advisories (.security/audit-waivers.json)
      #   security:data          real-format phone numbers / personal data in committed fixtures
      #   security:web           CSP nonce, headers, table-token cookie exchange, PWA rule
      #   security:quiet-errors  SEC-36: no raw error text on guest surfaces
      #   security:config-push   nobody pushes config.toml to the hosted project
      #   check:electron         sandbox / contextIsolation / navigation guards
      #   check:rpc-registry     every client-callable RPC classified; coverage floor
      #   check:assistant-coverage, check:error-codes, check:config-env, check:verify-jwt
      - name: pnpm security (every gate)
        run: pnpm security

      # SEC-28 (broadcast payloads) and SEC-29 (analytics payload) read the live
      # catalog over docker exec, so they run in the db job below, after
      # `supabase start`. Listing them here with no stack made this job fail on
      # every run.

      # Lock-taking and destructive DDL, scoped to the migrations THIS PR changes.
      # The 57 non-concurrent indexes already applied cannot be rewritten, so
      # history is grandfathered and only new migrations are judged.
      - name: Migration safety (changed files)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm --filter @touch/db check:migrations

  checks:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The brand faces are committed three times over — packages/ui/fonts/lama is
      # canonical, the copies under apps/*/public/fonts and apps/mobile/assets/fonts
      # are what the bundlers can actually reach. Update one and forget the others
      # and two apps render two different typefaces; nothing else in this pipeline
      # would notice, because every one of them is a valid font file.
      - name: Fonts in sync
        run: pnpm fonts:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

      # Code review tells you what the author meant to ship; this reads what the
      # bundler actually emitted. Runs here because `turbo build` has just
      # produced apps/web/.next — rebuilding it in the secrets job to scan it
      # would roughly double the pipeline for no extra coverage.
      - name: Built-artifact secret scan (web)
        run: node scripts/security/check-artifact-secrets.mjs --only=web

  operator-shell-windows:
    # The venue machines are Windows and better-sqlite3 is a native module —
    # ubuntu green says nothing about the Electron ABI actually compiling and
    # packaging there. `--dir` skips NSIS but exercises the full rebuild.
    name: operator shell (windows ABI + package smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + test on Windows
        run: pnpm --filter @touch/operator-shell typecheck && pnpm --filter @touch/operator-shell test

      # No secrets here on purpose: the JS config leaves signing out when the
      # env is absent, `--publish never` creates no publisher, and `--dir`
      # skips the update feed — so this proves the unsigned path packages.
      - name: Package smoke (unpacked dir, real ABI rebuild)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @touch/operator-shell dist:dir

      # win-unpacked carries app.asar plus the whole minified renderer — i.e.
      # exactly the bytes that land on the venue PC, a machine nobody administers.
      - name: Built-artifact secret scan (desktop)
        run: node scripts/security/check-artifact-secrets.mjs --only=desktop

  mobile:
    name: mobile (doctor + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches dependency ranges that drift off the SDK, duplicate copies of a
      # native module, and a broken metro/babel config.
      - name: expo-doctor
        working-directory: apps/mobile
        run: npx --yes expo-doctor@latest

      # Mounts all 23 screens, in English AND Arabic, and asserts each one's
      # primary action is on screen with the label its own catalog gives. The
      # bundle step below proves every module RESOLVES; this proves the screens
      # they build actually render — which until 2026-09-21 nothing did.
      # Runs under jest-expo, beside the vitest suite in `checks` (the two
      # globs cannot overlap: apps/mobile/jest.config.js says why).
      - name: Smoke render every screen (EN + AR)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm test:smoke

      # The decisive one: runs the whole Metro graph for both platforms, so a
      # module that cannot resolve — or a module-scope throw — fails the build
      # instead of shipping.
      - name: Bundle for iOS and Android
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm exec expo export --platform ios --platform android --output-dir dist

      # The bundle that would be pushed to every guest phone, including over an
      # EAS update with no store review in between.
      - name: Built-artifact secret scan (mobile)
        working-directory: ${{ github.workspace }}
        run: node scripts/security/check-artifact-secrets.mjs --only=mobile

  db:
    name: db (migrations + RLS/concurrency tests)
    runs-on: ubuntu-latest
    # Honest signal: this job is REQUIRED (no continue-on-error). It will first go green
    # once packages/db exists with migrations under packages/db/supabase/migrations/.
    # Until then it fails, and that is correct — the pipeline promise is real, not decorative.
    continue-on-error: false
    # A green run takes about 7 minutes. Without this the default of 360 applies,
    # and a stuck lock wait held this job for six hours (2026-09-29).
    timeout-minutes: 45
    # S10: the test-OTP code is not in the repository. The CLI substitutes
    # env(SUPABASE_AUTH_SMS_TEST_OTP_CODE) in config.toml at `supabase start`,
    # so it has to be in the environment of every step of this job — `supabase
    # start` reads it, and tests/phone-otp.test.ts sends it. Job level, not step
    # level, because both ends need the same value.
    # No `|| '123456'` fallback anywhere: a constant written into ci.yml is the
    # code committed to the repository again, under a different filename.
    env:
      SUPABASE_AUTH_SMS_TEST_OTP_CODE: ${{ vars.SUPABASE_AUTH_SMS_TEST_OTP_CODE }}
      # tests/helpers.ts stackAvailable() throws instead of returning false, so
      # a stack that does not answer fails the file instead of skipping it.
      TP_REQUIRE_STACK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: the types-drift check diffs generated output, and the
          # generator ships with the CLI. Bump deliberately, regenerating
          # types.gen.ts in the same commit.
          version: 2.116.0

      # Fail here, with a sentence, rather than six steps later on a phone test
      # that cannot explain itself. A fork PR cannot read repository variables,
      # so it is skipped there and the phone stack block skips itself in turn.
      - name: Test-OTP variable present
        if: github.event.pull_request.head.repo.fork != true
        run: |
          if [ -z "$SUPABASE_AUTH_SMS_TEST_OTP_CODE" ]; then
            echo "::error::SUPABASE_AUTH_SMS_TEST_OTP_CODE is empty. config.toml resolves the [auth.sms.test_otp] code through env() (see packages/db/.env.example); create the repository variable under Settings → Secrets and variables → Actions → Variables (PHASE-2-CHECKLIST.md:47)."
            exit 1
          fi
          echo "Test-OTP code present (${#SUPABASE_AUTH_SMS_TEST_OTP_CODE} chars)."

      - name: Start local Supabase stack
        working-directory: packages/db
        run: supabase start

      - name: Apply migrations from a clean slate
        working-directory: packages/db
        run: supabase db reset

      # The served-function suites (ticket-begin, protocol-action, receipt-scan,
      # apple-revoke, send-push, …) probe the runtime and skip without it, and
      # until 2026-10-01 this job never started it: they skipped on every run.
      # check-no-skips below now fails the job on that. Started BEFORE the
      # tests: `functions serve` restarts the gateway, and a restart in the
      # middle of the suite drops connections ("fetch failed: other side
      # closed"). Same readiness rule as bench.yml: replay answers 401 and auth
      # is up on three consecutive polls.
      - name: Serve edge functions
        working-directory: packages/db
        run: |
          echo "RECEIPT_READER=fake" >> supabase/functions/.env
          nohup supabase functions serve > /tmp/functions.log 2>&1 &
          ok=0
          for _ in $(seq 1 90); do
            fn=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 -X POST "http://127.0.0.1:54321/functions/v1/replay" || true)
            au=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:54321/auth/v1/health" || true)
            if [ "$fn" = "401" ] && [ "$au" = "200" ]; then ok=$((ok+1)); else ok=0; fi
            [ "$ok" -ge 3 ] && break
            sleep 2
          done
          cat /tmp/functions.log
          if [ "$ok" -lt 3 ]; then echo "::error::the edge runtime never became ready"; exit 1; fi

      # The authz sweep's ownership stage cannot be static: it has to hold a real
      # slot as one account and prove a second account can neither confirm, cancel
      # nor read it (the C1/H3 class). That needs an active court, and courts live
      # only in fixtures/courts.sql — `db reset` does not load them. Without this
      # the stage refuses to report a pass and exits 1, so those seven ownership
      # assertions were never actually running here.
      - name: Load fixtures
        run: pnpm db:fixtures

      # Structural guard for the 0038/0044 lock order. Catches an inverted or a
      # missing lock by walking the pg_proc call graph (helpers and triggers
      # included) - the two 0043 money defects were both invisible to race tests,
      # because after correct serialization the legitimate interleavings and the
      # buggy one reach identical end states.
      - name: Lock-order invariant
        run: pnpm --filter @touch/db check:locks
      # Executes every client-callable SECURITY DEFINER RPC as an anonymous guest.
      # Guests hold `authenticated` exactly as staff do, so an RPC missing its own
      # guard is open to anyone who scans a table QR. Static scanning is not enough
      # here - the analytics family guards one call deep, inside analytics_guard().
      - name: RPC authorization sweep
        run: pnpm --filter @touch/db check:authz
      # safeupdate is loaded on PostgREST connections, so a WHERE-less UPDATE or
      # DELETE inside a definer function is refused for every real caller while
      # working fine from the service role the DB suites use. That is exactly how
      # set_opening_hours and set_waiter_call_cooldown shipped broken and stayed
      # broken — the opening-hours screen could not save, ever.
      - name: safeupdate invariant
        run: pnpm --filter @touch/db check:safeupdate
      # Views that read past the caller's RLS, and definer functions that resolve
      # unqualified names using the CALLER's search_path. Both are true-today
      # properties; this is the lock so the next migration cannot forget.
      - name: Database invariants (views + search_path)
        run: pnpm --filter @touch/db check:invariants
      # SEC-28. What a kitchen screen receives. Prep needs what to cook and how
      # long it has waited — never what it sold for or who the guest is. Lives
      # in THIS job, not the secret gates: it reads pg_proc, so a payload added
      # by a migration nobody reviewed for this is still seen — and that costs a
      # running database. Under the secret gates it had no stack to read and
      # `docker exec` failed on a missing container every single run.
      - name: Broadcast payloads (SEC-28)
        run: pnpm --filter @touch/db check:broadcast
      # SEC-29. Analytics output is POSTed to Groq, a third-party LLM outside the
      # venue. A guest id in an aggregate is a guest record sent to a processor
      # the privacy notice does not cover. Reads the catalog for the same reason,
      # so it belongs to the same job.
      - name: Analytics payload (SEC-29)
        run: pnpm --filter @touch/db check:analytics
      # Runs the @touch/db test suite — includes the RLS matrix and the reservation
      # concurrency suite, which only make sense with the stack up (hence this job).
      - name: DB tests (RLS + concurrency)
        # Verbose so a hang names the file that is running, not just the last one done.
        # The JSON report feeds the skip check below.
        run: pnpm --filter @touch/db test -- --reporter=verbose --reporter=json --outputFile.json=vitest-report.json

      # With the stack up and the functions served, a skipped test is a probe
      # that failed, not a laptop without Docker. Only the by-design skips in
      # packages/db/fixtures/test-skip-allowlist.json pass.
      - name: No silently skipped tests
        if: success() || failure()
        working-directory: packages/db
        run: |
          if [ ! -f vitest-report.json ]; then echo "::error::no vitest report was written"; exit 1; fi
          node scripts/check-no-skips.mjs vitest-report.json

      # Types drift guard: regenerate types from the live schema and fail if the committed
      # src/types.gen.ts is stale. NOTE: until the first real generation is committed this
      # step will fail alongside the rest of the job — expected; do NOT soften it with
      # continue-on-error, the first migrations PR must also commit the generated types.
      - name: Types drift check
        run: |
          pnpm --filter @touch/db db:types
          git diff --exit-code -- packages/db/src/types.gen.ts

      - name: Stop local Supabase stack
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # e2e (Playwright) — ENABLED 2026-08-28.
  #
  # This was parked from day 1 because booting both dev servers on top of
  # `supabase start` is expensive. The cost of leaving it parked turned out to
  # be higher: the operator has 89 React components and, until 2026-08-28, no
  # way to unit-test any of them, so this suite was the ONLY thing exercising
  # the till, the desk calendar, the KDS and every admin editor — and it ran
  # only when someone remembered to run it locally.
  #
  # Both locales run: the config splits chromium-en / chromium-ar by @ar tag.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (Playwright, EN + AR)
    runs-on: ubuntu-latest
    # This job also runs `supabase start`, so it needs the same substitution
    # (S10). No literal fallback: see the db job above.
    env:
      SUPABASE_AUTH_SMS_TEST_OTP_CODE: ${{ vars.SUPABASE_AUTH_SMS_TEST_OTP_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: the types-drift check diffs generated output, and the
          # generator ships with the CLI. Bump deliberately, regenerating
          # types.gen.ts in the same commit.
          version: 2.116.0

      # Fail here, with a sentence, rather than six steps later on a phone test
      # that cannot explain itself. A fork PR cannot read repository variables,
      # so it is skipped there and the phone stack block skips itself in turn.
      - name: Test-OTP variable present
        if: github.event.pull_request.head.repo.fork != true
        run: |
          if [ -z "$SUPABASE_AUTH_SMS_TEST_OTP_CODE" ]; then
            echo "::error::SUPABASE_AUTH_SMS_TEST_OTP_CODE is empty. config.toml resolves the [auth.sms.test_otp] code through env() (see packages/db/.env.example); create the repository variable under Settings → Secrets and variables → Actions → Variables (PHASE-2-CHECKLIST.md:47)."
            exit 1
          fi
          echo "Test-OTP code present (${#SUPABASE_AUTH_SMS_TEST_OTP_CODE} chars)."

      - name: Start local Supabase stack
        working-directory: packages/db
        run: supabase start

      - name: Apply migrations from a clean slate
        working-directory: packages/db
        run: supabase db reset

      # Courts, menu, recipes, tables, stock — the suites assert against these.
      - name: Load fixtures
        run: pnpm db:fixtures

      # The analytics e2e case asserts the operator sales-only mode, which it can
      # only reach by getting a 503 NOT_CONFIGURED from analytics-posthog. With no
      # runtime the request 404s, the client reads that as a generic error, and the
      # notice never renders — the suite would fail for a reason that has nothing to
      # do with the code under test. supabase start does NOT serve functions.
      - name: Serve edge functions
        working-directory: packages/db
        run: |
          # receipt-scan reads with the stand-in model (no key, no spend); the
          # CLI loads supabase/functions/.env by default.
          echo "RECEIPT_READER=fake" >> supabase/functions/.env
          nohup supabase functions serve > /tmp/functions.log 2>&1 &
          # Any HTTP status means the runtime is answering; 401 is the expected
          # one here, since analytics-posthog has verify_jwt = true.
          for _ in $(seq 1 60); do
            curl -s -o /dev/null --max-time 2 "http://127.0.0.1:54321/functions/v1/analytics-posthog" && break
            sleep 2
          done
          cat /tmp/functions.log

      - name: Install Playwright browser
        run: pnpm e2e:install

      # playwright.config.ts boots both dev servers itself and forces them onto
      # the local stack, so staging is never touched from CI.
      - name: Run e2e
        run: pnpm e2e

      # SEC-25. Two assertions in web-security-headers.spec.ts are PRODUCTION
      # properties — no 'unsafe-eval' in script-src, and every <script> in the
      # served HTML nonced. `next dev` needs eval for HMR and injects its own
      # un-nonced overlay scripts, so under the run above they SKIP. They skipped
      # on every machine and every CI run this project ever had.
      #
      # This step builds the web app and runs that one spec against `next start`.
      # Only that spec: a full production e2e pass would double the job for no
      # extra security signal, and these are the only production-gated cases.
      - name: Run web security headers against a PRODUCTION build
        env:
          E2E_PROD_BUILD: '1'
        run: pnpm exec playwright test --config e2e/playwright.config.ts e2e/tests/web-security-headers.spec.ts

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup
