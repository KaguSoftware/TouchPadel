name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen lockfile is the rule; the `|| pnpm install` fallback only exists so the very
      # first runs (before pnpm-lock.yaml is committed) don't hard-fail. Remove the fallback
      # once the lockfile lands.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

  db:
    name: db (migrations + RLS/concurrency tests)
    runs-on: ubuntu-latest
    # Honest signal: this job is REQUIRED (no continue-on-error). It will first go green
    # once packages/db exists with migrations under packages/db/supabase/migrations/.
    # Until then it fails, and that is correct — the pipeline promise is real, not decorative.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        working-directory: packages/db
        run: supabase start

      - name: Apply migrations from a clean slate
        working-directory: packages/db
        run: supabase db reset

      # Runs the @touch/db test suite — includes the RLS matrix and the reservation
      # concurrency suite, which only make sense with the stack up (hence this job).
      - name: DB tests (RLS + concurrency)
        run: pnpm --filter @touch/db test

      # Types drift guard: regenerate types from the live schema and fail if the committed
      # src/types.gen.ts is stale. NOTE: until the first real generation is committed this
      # step will fail alongside the rest of the job — expected; do NOT soften it with
      # continue-on-error, the first migrations PR must also commit the generated types.
      - name: Types drift check
        run: |
          pnpm --filter @touch/db db:types
          git diff --exit-code -- packages/db/src/types.gen.ts

      - name: Stop local Supabase stack
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # e2e (Playwright) — NOT ENABLED YET. The suite exists at e2e/ and runs
  # locally with `pnpm e2e` (requires the local Supabase stack + fixtures:
  # `pnpm db:start && pnpm db:reset && pnpm db:fixtures`). Enabling it in CI
  # means paying the cost of booting BOTH dev servers (Next 16 first compile is
  # slow) on top of `supabase start`, so it is parked until the pipeline gets a
  # dedicated job. Sketch for later:
  #
  # e2e:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: 22, cache: pnpm }
  #     - uses: supabase/setup-cli@v1
  #     - run: pnpm install --frozen-lockfile
  #     - run: supabase start          # in packages/db
  #     - run: supabase db reset       # migrations + seed
  #     - run: pnpm db:fixtures        # menu/tables/courts/stock fixtures
  #     - run: pnpm e2e:install        # playwright install chromium
  #     - run: pnpm e2e                # config boots both dev webServers itself
  #     - run: supabase stop --no-backup
  #       if: always()
  # ---------------------------------------------------------------------------
