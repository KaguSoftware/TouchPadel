name: DB Migrate (staging)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/db/supabase/migrations/**'

concurrency:
  group: db-migrate
  cancel-in-progress: false # never cancel a running migration push

jobs:
  staging:
    name: Push migrations to staging
    runs-on: ubuntu-latest

    # Security Layer 1, Block 3 (SEC-02). GitHub's default job timeout is 360
    # MINUTES. This job takes a lock on the venue's live database; if a push
    # blocks behind a long Realtime transaction, the default would let it sit
    # there for six hours with the till frozen behind it. Fifteen minutes is far
    # longer than any healthy push and far shorter than a service.
    #
    # This is the outer bound only — the real control is `lock_timeout = '3s'`
    # at the top of each migration (enforced by check:migrations), which makes
    # the statement give up in seconds. This is what catches everything else:
    # a hung network call, a CLI that never returns, a stuck approval.
    timeout-minutes: 15

    # The linked Supabase project is the CLIENT'S long-term production database
    # (HANDOFF.md: additive migrations only, never destructive ops). Binding the
    # job to a GitHub Environment gives that push a human gate: add "Required
    # reviewers" to the `staging` environment in
    #   Settings → Environments → staging
    # and every migration push waits for an approval instead of applying itself
    # the moment someone merges to main. Without reviewers configured this is a
    # no-op, so ADD THEM before the deploy secrets go in.
    environment: staging

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The hosted rollout is owner-run and the deploy secrets are deliberately
      # absent until then (see HANDOFF roadmap). An unconfigured repo must SKIP
      # this push with a visible notice, not fail every migration commit red —
      # a permanently-failing required check trains everyone to ignore it.
      - name: Preflight — are the deploy secrets configured?
        id: preflight
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ACCESS_TOKEN:-}" ] || missing="${missing} SUPABASE_ACCESS_TOKEN"
          [ -n "${PROJECT_REF:-}" ]  || missing="${missing} PROJECT_REF"
          [ -n "${DB_PASSWORD:-}" ]  || missing="${missing} SUPABASE_DB_PASSWORD"

          if [ -n "${missing}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging migration push skipped::Missing repository secrets:${missing}"
            {
              echo "### ⏭️ Staging migration push skipped"
              echo
              echo "Missing repository secrets:"
              for s in ${missing}; do echo "- \`${s}\`"; done
              echo
              echo "Migrations were **not** applied to the hosted project."
              echo "Add the secrets under *Settings → Secrets and variables → Actions*"
              echo "(and required reviewers on the \`staging\` environment) when the"
              echo "hosted rollout is ready."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A malformed ref otherwise surfaces as a confusing CLI error. The ref is
          # the bare project id (e.g. abcdefghijklmnopqrst) — NOT a URL, and not
          # the full db host. Reject anything with a scheme, dot or slash in it.
          if ! printf '%s' "${PROJECT_REF}" | grep -Eq '^[a-z0-9]{15,40}$'; then
            echo "::error title=Bad PROJECT_REF::Expected a bare Supabase project ref (lowercase id, no scheme/dots/slashes)."
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Link to staging project
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: supabase link --project-ref "${{ secrets.PROJECT_REF }}"

      # Print the plan before touching the client's database, so the run log
      # shows exactly which migrations a push applied.
      - name: Show pending migrations
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: supabase migration list

      # Security Layer 1, Block 3 (SEC-02): the reviewer approving this run in
      # the `staging` environment gate needs to see WHAT it will change, not
      # just which files are pending. `db diff` prints the actual schema delta
      # between the hosted project and this commit.
      #
      # `|| true` on purpose: a diff failure must not block the push. This step
      # is information for the human at the gate, and an unreadable diff is a
      # worse reason to skip a migration than no diff at all.
      - name: Print the schema diff for the reviewer
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: |
          {
            echo "### Schema diff — hosted project vs this commit"
            echo '```sql'
            supabase db diff --linked 2>&1 || echo "(diff unavailable — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Security Layer 1, Block 3 (SEC-02): a data-only dump of the APPEND-ONLY
      # ledgers, taken BEFORE the push and retained as an artifact.
      #
      # These four tables are the ones with no undo: audit_log, stock_ledger and
      # payments have UPDATE and DELETE revoked precisely because they are the
      # financial and accountability record. If a migration goes wrong against
      # them there is no staging copy to compare with and no PITR rehearsal
      # (D1/SEC-38) — this dump is the only "before" that will exist.
      #
      # Data only, no schema: it is evidence, not a restore path.
      - name: Ledger snapshot before the push
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        continue-on-error: true
        run: |
          set -o pipefail
          supabase db dump --linked --data-only \
            --schema app \
            -f ledger-snapshot.sql 2>&1 | tail -5
          ls -lh ledger-snapshot.sql

      - name: Upload ledger snapshot
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-snapshot-${{ github.sha }}
          path: packages/db/ledger-snapshot.sql
          # Long enough to cover a dispute that surfaces weeks later; short
          # enough that guest data is not retained indefinitely in CI storage
          # (the retention policy lands in security-general.md phase 8).
          retention-days: 30
          if-no-files-found: warn

      - name: Push migrations
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: supabase db push

  # ---------------------------------------------------------------------------
  # W5 — PRODUCTION (client's Supabase project, Frankfurt eu-central-1).
  # Uncomment once the Touch-owned project exists and the `production` GitHub
  # Environment is configured with required reviewers (manual approval gate).
  # Remember: the table-token Vault secret must be set to the SAME value on the
  # client project before pushing, or every printed QR dies (see HANDOFF.md).
