name: DB Migrate (staging)

on:
  workflow_dispatch:
    inputs:
      include_all:
        # `supabase db push` refuses a local migration that sorts BEFORE a
        # version already on the remote ledger, and with it every later one.
        # That is the right default: a stranded file must be noticed, not
        # applied late in an order nobody reviewed (two migrations that
        # `create or replace` the same function are order-sensitive). This
        # switch is the deliberate, reviewed exception — the "Show pending
        # migrations" step prints exactly what it will apply, and the
        # `staging` reviewer approves that list. Used once on 2026-09-12 for
        # 20260906000071_booking_integrity; check-migrations.mjs now fails a
        # pull request that would create the situation again.
        description: 'Also apply migrations that sort before the newest remote version (--include-all)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'packages/db/supabase/migrations/**'

concurrency:
  group: db-migrate
  cancel-in-progress: false # never cancel a running migration push

# Security audit S9 (2026-09-20): read-only GITHUB_TOKEN. The push reaches the
# hosted project through SUPABASE_ACCESS_TOKEN + the DB password, and the
# snapshot artifact needs no token scope; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  staging:
    name: Push migrations to staging
    runs-on: ubuntu-latest

    # Security Layer 1, Block 3 (SEC-02). GitHub's default job timeout is 360
    # MINUTES. This job takes a lock on the venue's live database; if a push
    # blocks behind a long Realtime transaction, the default would let it sit
    # there for six hours with the till frozen behind it. Fifteen minutes is far
    # longer than any healthy push and far shorter than a service.
    #
    # This is the outer bound only — the real control is `lock_timeout = '3s'`
    # at the top of each migration (enforced by check:migrations), which makes
    # the statement give up in seconds. This is what catches everything else:
    # a hung network call, a CLI that never returns, a stuck approval.
    timeout-minutes: 15

    # The linked Supabase project is the CLIENT'S long-term production database
    # (HANDOFF.md: additive migrations only, never destructive ops). Binding the
    # job to a GitHub Environment gives that push a human gate: add "Required
    # reviewers" to the `staging` environment in
    #   Settings → Environments → staging
    # and every migration push waits for an approval instead of applying itself
    # the moment someone merges to main. Without reviewers configured this is a
    # no-op, so ADD THEM before the deploy secrets go in.
    environment: staging

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned 2026-09-20 (audit S9): a `latest` CLI holding the production
          # DB password changes under the workflow with no review — and this is
          # the one job that writes to the client's database. 2.116.0 is what
          # ci.yml's db and e2e jobs have run green on since 2026-09-07, so every
          # workflow now uses one version; the lockfile's 2.115.0 is the
          # developer copy. Bump all five workflows together.
          version: 2.116.0

      # The hosted rollout is owner-run and the deploy secrets are deliberately
      # absent until then (see HANDOFF roadmap). An unconfigured repo must SKIP
      # this push with a visible notice, not fail every migration commit red —
      # a permanently-failing required check trains everyone to ignore it.
      - name: Preflight — are the deploy secrets configured?
        id: preflight
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ACCESS_TOKEN:-}" ] || missing="${missing} SUPABASE_ACCESS_TOKEN"
          [ -n "${PROJECT_REF:-}" ]  || missing="${missing} PROJECT_REF"
          [ -n "${DB_PASSWORD:-}" ]  || missing="${missing} SUPABASE_DB_PASSWORD"

          if [ -n "${missing}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging migration push skipped::Missing repository secrets:${missing}"
            {
              echo "### ⏭️ Staging migration push skipped"
              echo
              echo "Missing repository secrets:"
              for s in ${missing}; do echo "- \`${s}\`"; done
              echo
              echo "Migrations were **not** applied to the hosted project."
              echo "Add the secrets under *Settings → Secrets and variables → Actions*"
              echo "(and required reviewers on the \`staging\` environment) when the"
              echo "hosted rollout is ready."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A malformed ref otherwise surfaces as a confusing CLI error. The ref is
          # the bare project id (e.g. abcdefghijklmnopqrst) — NOT a URL, and not
          # the full db host. Reject anything with a scheme, dot or slash in it.
          if ! printf '%s' "${PROJECT_REF}" | grep -Eq '^[a-z0-9]{15,40}$'; then
            echo "::error title=Bad PROJECT_REF::Expected a bare Supabase project ref (lowercase id, no scheme/dots/slashes)."
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Link to staging project
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: supabase link --project-ref "${{ secrets.PROJECT_REF }}"

      # Print the plan before touching the client's database, so the run log
      # shows exactly which migrations a push applied.
      - name: Show pending migrations
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: supabase migration list

      # Security Layer 1, Block 3 (SEC-02): the reviewer approving this run in
      # the `staging` environment gate needs to see WHAT it will change, not
      # just which files are pending. `db diff` prints the actual schema delta
      # between the hosted project and this commit.
      #
      # `|| true` on purpose: a diff failure must not block the push. This step
      # is information for the human at the gate, and an unreadable diff is a
      # worse reason to skip a migration than no diff at all.
      - name: Print the schema diff for the reviewer
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: |
          {
            echo "### Schema diff — hosted project vs this commit"
            echo '```sql'
            supabase db diff --linked 2>&1 || echo "(diff unavailable — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Security Layer 1, Block 3 (SEC-02): a data-only dump of the APPEND-ONLY
      # ledgers, taken BEFORE the push and retained as an artifact.
      #
      # The five public tables with an `*_ao` forbid_mutation trigger —
      # audit_log, payments, refunds, stock_movements, sync_replays — are the
      # ones with no undo: UPDATE and DELETE are revoked precisely because they
      # are the financial and accountability record. If a migration goes wrong
      # against them there is no staging copy to compare with and no PITR
      # rehearsal (D1/SEC-38) — this dump is the only "before" that will exist.
      #
      # Data only, no schema: it is evidence, not a restore path.
      #
      # Until 2026-09-20 this dumped `--schema app` (audit M7 / plan S9). The
      # ledgers live in `public`; what `app` holds is app.secrets (the
      # table-token HMAC fallback), sms_sends phone numbers and pin_attempts,
      # all of which went into an artifact any repo reader could download.
      # `db dump` has no include-table flag — only `--schema` plus
      # `-x schema.table`, each of which becomes a pg_dump --exclude-table
      # (verify with --dry-run) — so the exclusion list is read from the live
      # catalog on every run: every public base table that is not a ledger.
      # A table added tomorrow is therefore excluded by default instead of
      # leaking by default, and a listing that cannot be parsed takes no
      # snapshot at all. `db query` goes through the Management API, so it
      # needs the link and the access token but not the DB password.
      - name: Ledger snapshot before the push
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        continue-on-error: true
        run: |
          set -euo pipefail
          ledgers="audit_log payments refunds stock_movements sync_replays"
          quoted=$(printf "'%s'," $ledgers); quoted=${quoted%,}
          others="from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE' and table_name not in ($quoted)"
          # One statement (`db query` returns only the last result): a marked
          # row per table to exclude, plus a count row to check the parse
          # against, so a wrapped or truncated listing fails closed.
          if ! listing=$(supabase db query --linked "select 'x:' || table_name as t $others union all select 'n:' || count(*) $others"); then
            echo "::error title=Ledger snapshot skipped::could not list the public tables; nothing was dumped"
            exit 1
          fi
          mapfile -t exclude < <(grep -oE '\bx:[a-z0-9_]+' <<<"$listing" | cut -c3- | sort -u)
          expected=$(grep -oE '\bn:[0-9]+' <<<"$listing" | head -1 | cut -c3- || true)
          if [ -z "$expected" ] || [ "$expected" -lt 1 ] || [ "${#exclude[@]}" -ne "$expected" ]; then
            echo "::error title=Ledger snapshot skipped::parsed ${#exclude[@]} tables to exclude but the catalog says '${expected:-?}'; nothing was dumped"
            exit 1
          fi
          echo "dumping: $ledgers (excluding ${#exclude[@]} other public tables)"
          supabase db dump --linked --data-only --schema public \
            -x "$(printf 'public.%s,' "${exclude[@]}" | sed 's/,$//')" \
            -f ledger-snapshot.sql 2>&1 | tail -5
          ls -lh ledger-snapshot.sql

      - name: Upload ledger snapshot
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Renamed from ledger-snapshot-* on 2026-09-20 so the pre-fix artifacts
          # (the `app` schema) can be deleted by name without touching these.
          name: public-ledgers-${{ github.sha }}
          path: packages/db/ledger-snapshot.sql
          # A migration that damages a ledger shows up within the first service
          # day or two; a week covers the diff-and-decide window. Audit rows
          # still name guests and devices, so the file does not sit in CI
          # storage for a month (2026-09-20, was 30).
          retention-days: 7
          if-no-files-found: warn

      # `--yes` because this is non-interactive (the CLI otherwise prompts on a
      # push it considers unusual). `--include-all` only when the dispatcher
      # asked for it — see the input's comment.
      - name: Push migrations
        if: steps.preflight.outputs.configured == 'true'
        working-directory: packages/db
        run: supabase db push --yes ${{ inputs.include_all == true && '--include-all' || '' }}

  # ---------------------------------------------------------------------------
  # W5 — PRODUCTION (client's Supabase project, Frankfurt eu-central-1).
  # Uncomment once the Touch-owned project exists and the `production` GitHub
  # Environment is configured with required reviewers (manual approval gate).
  # Remember: the table-token Vault secret must be set to the SAME value on the
  # client project before pushing, or every printed QR dies (see HANDOFF.md).
  # ---------------------------------------------------------------------------
