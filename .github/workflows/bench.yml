name: Bench (db)

# The nightly performance gate for packages/db (Phase 2, Milestone 0 item 11).
#
# Two modes, one job:
#
#   measure (the default, and what the schedule runs) — measure the REFERENCE
#            commit (bench/baseline.json meta.sha) and HEAD back to back on
#            THIS runner, and diff the two (compare.ts --against). A row more
#            than 10 % AND more than 10 ms slower on HEAD fails the run, as does
#            a changed outcome, a failed invariant or a row HEAD lost.
#            Until 2026-10-01 HEAD was diffed against the committed numbers
#            themselves, taken on another runner on 09-23. GitHub's runners
#            differ by more than 10 %, so every scheduled run from 09-22 on was
#            red (+40-120 % on every row, unrelated paths included) and the
#            gate meant nothing.
#   baseline — take HEAD's numbers and WRITE bench/baseline.json, then upload
#            it. Download that artifact and commit the file: committing it is
#            how the REFERENCE COMMIT moves forward (after an accepted
#            slowdown, or to lock in a speed-up). Its numbers are a record for
#            humans; the nightly re-measures the reference commit every time.
#
# It is deliberately not part of CI. A bench that has to finish before a pull
# request merges gets tuned until it is fast rather than until it is true, and
# a long job on every push would make the whole pipeline hostile.

on:
  schedule:
    # 02:00 UTC = 05:00 Asia/Baghdad, well clear of the venue's trading hours
    # and of the usual working-day pushes.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'measure = diff HEAD against the reference commit on this runner; baseline = write a new baseline from HEAD'
        type: choice
        options: [measure, baseline]
        default: measure
      repeat:
        description: 'Runs of the whole suite per tree; each row keeps the MEDIAN of its p95s'
        default: '3'

# Never cancel a bench in flight. cancel-in-progress would leave a half-drained
# replay queue and a seeded database behind, and a partial run has no honest
# numbers in it anyway.
concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    name: bench (booking, cafe, analytics, replay)
    runs-on: ubuntu-latest
    # Two full passes (reference, then HEAD) since 2026-10-01.
    timeout-minutes: 90
    env:
      # S10: the test OTP code lives in a repository variable, never in the
      # repo. config.toml reads env(SUPABASE_AUTH_SMS_TEST_OTP_CODE), and
      # `supabase start` below fails loudly without it.
      SUPABASE_AUTH_SMS_TEST_OTP_CODE: ${{ vars.SUPABASE_AUTH_SMS_TEST_OTP_CODE }}
      MODE: ${{ inputs.mode || 'measure' }}
      REPEAT: ${{ inputs.repeat || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: the types-drift check diffs generated output, and the
          # generator ships with the CLI. Bump deliberately, regenerating
          # types.gen.ts in the same commit.
          version: 2.116.0

      # The reference commit gets its own worktree and its own install, so its
      # migrations, fixtures, seed, functions and bench code are the ones it
      # shipped with.
      - name: Check out the reference commit
        if: env.MODE == 'measure'
        run: |
          set -euo pipefail
          ref=$(node -e "console.log(require('./packages/db/bench/baseline.json').meta.sha)")
          git worktree add "$RUNNER_TEMP/ref" "$ref"
          pnpm install --frozen-lockfile --dir "$RUNNER_TEMP/ref"
          echo "- Reference commit: ${ref:0:8}" >> "$GITHUB_STEP_SUMMARY"

      - name: Start local Supabase stack
        working-directory: packages/db
        run: supabase start

      # One pass of the bench for one tree: a clean schema from THAT tree's
      # migrations; the fixtures (courts, rate rules, opening hours — the
      # booking rows fail NO_RATE and occupancy reads zero without them); the
      # ~12,800-booking bench seed; that tree's edge functions served
      # (replay.drain_500 posts to /functions/v1/replay, and `functions serve`
      # restarts the gateway, so readiness is three consecutive 401s from replay
      # with auth up — 2026-09-30); the bench; the teardown.
      - name: Write the per-tree bench script
        run: |
          cat > "$RUNNER_TEMP/bench-tree.sh" <<'SH'
          set -euo pipefail
          tree="$1"; out="$2"
          cd "$tree"
          (cd packages/db && supabase db reset)
          pnpm db:fixtures
          pnpm --filter @touch/db bench:seed
          pkill -f 'supabase functions serve' || true
          (cd packages/db && nohup supabase functions serve > "$out.functions.log" 2>&1 &)
          ok=0
          for _ in $(seq 1 90); do
            fn=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 -X POST "http://127.0.0.1:54321/functions/v1/replay" || true)
            au=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:54321/auth/v1/health" || true)
            if [ "$fn" = "401" ] && [ "$au" = "200" ]; then ok=$((ok+1)); else ok=0; fi
            [ "$ok" -ge 3 ] && break
            sleep 2
          done
          if [ "$ok" -lt 3 ]; then
            echo "::error::the edge runtime never became ready for $tree"
            cat "$out.functions.log"
            exit 1
          fi
          pnpm --filter @touch/db bench -- --repeat="$REPEAT" --out="$out"
          pnpm --filter @touch/db bench:teardown
          SH

      # A p95 means nothing without the machine it was taken on, so the model
      # is in the summary of every run, not only in the results JSON. Both trees
      # are measured on this one machine, which is the point of the A/B.
      - name: Record the runner
        run: |
          {
            echo "### Runner"
            echo ''
            echo "- CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
            echo "- Cores: $(nproc)"
            echo "- Memory: $(free -h | awk '/^Mem:/ {print $2}')"
            echo "- Mode: ${MODE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bench the reference commit
        if: env.MODE == 'measure'
        run: bash "$RUNNER_TEMP/bench-tree.sh" "$RUNNER_TEMP/ref" "$RUNNER_TEMP/ref-results"

      - name: Bench HEAD
        run: bash "$RUNNER_TEMP/bench-tree.sh" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/packages/db/bench/results"

      - name: Compare HEAD with the reference commit (same runner)
        if: env.MODE == 'measure'
        run: pnpm --filter @touch/db bench:compare -- --against="$RUNNER_TEMP/ref-results"

      - name: Write a new baseline
        if: env.MODE == 'baseline'
        run: pnpm --filter @touch/db bench:baseline

      # if: always() — a red compare is exactly when somebody needs the numbers.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ inputs.mode || 'measure' }}-${{ github.run_id }}
          path: |
            packages/db/bench/results/
            packages/db/bench/baseline.json
            ${{ runner.temp }}/ref-results/
          retention-days: 30

      # The per-tree script tears down after each pass; this catches a pass
      # that failed half-way. Idempotent (every delete is a predicate).
      - name: Tear down the bench fixture
        if: always()
        run: pnpm --filter @touch/db bench:teardown

      - name: Stop the stack
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup
