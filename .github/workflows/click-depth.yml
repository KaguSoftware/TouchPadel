name: Click depth

# Fails a pull request when any button takes more clicks than allowed to reach
# from its app's home screen (scripts/click-depth.mjs, click-depth.config.json).
#
# Its own workflow on purpose, not a job in ci.yml: deploy.yml and
# operator-release.yml follow the workflow NAMED "CI", so a click-depth
# violation reports on the pull request without gating a deploy or a release.
on:
  pull_request:

concurrency:
  group: click-depth-${{ github.ref }}
  cancel-in-progress: true

# Security audit S9: read-only GITHUB_TOKEN, as in ci.yml.
permissions:
  contents: read

jobs:
  # Static route-graph check over apps/mobile. Expo has no web target, so no
  # browser can click it; this reads the expo-router tree instead. Seconds.
  mobile:
    name: click depth (mobile, static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check click depth
        run: pnpm check:click-depth --target mobile

  # A real breadth-first crawl of the operator, signed in as the seeded owner
  # on the LOCAL Supabase stack. apps/operator/.env points at the hosted
  # project, so the build gets the local URL and demo key through the process
  # environment (real env beats .env files, and Vite inlines them at build
  # time) — the same override e2e/playwright.config.ts uses.
  operator:
    name: click depth (operator, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # `supabase start` resolves config.toml through env() (S10), as in ci.yml.
      SUPABASE_AUTH_SMS_TEST_OTP_CODE: ${{ vars.SUPABASE_AUTH_SMS_TEST_OTP_CODE }}
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      # Long-standing `supabase start` demo key — LOCAL ONLY, no secret value
      # (also in e2e/playwright.config.ts and e2e/tests/helpers.ts).
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      STORAGE_STATE: test-results/click-depth/owner.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          # Same pin as ci.yml.
          version: 2.116.0

      - name: Start local Supabase stack
        working-directory: packages/db
        run: supabase start

      - name: Apply migrations from a clean slate
        working-directory: packages/db
        run: supabase db reset

      # Courts, menu, tables, stock: without them most screens hide their buttons.
      - name: Load fixtures
        run: pnpm db:fixtures

      - name: Install Playwright browser
        run: pnpm e2e:install

      - name: Build and start the operator
        run: |
          pnpm --filter @touch/operator build
          nohup pnpm --filter @touch/operator exec vite preview --port 4173 --strictPort > /tmp/operator.log 2>&1 &

      - name: Wait for the operator
        run: pnpm dlx wait-on@9.5.1 --timeout 120000 http://localhost:4173

      # Opens the business day on the local stack and signs the seeded owner in
      # through the UI, saving the session to STORAGE_STATE (under the
      # gitignored test-results/).
      - name: Seed the crawl and sign in
        run: node scripts/click-depth/operator-auth.mjs "$STORAGE_STATE"

      - name: Check click depth
        run: pnpm check:click-depth --target operator

      - name: Upload operator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: click-depth-operator
          path: /tmp/operator.log
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup
