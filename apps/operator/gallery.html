<!doctype html>
<!-- Dev-only surface gallery. Not part of the app bundle; see src/gallery.tsx. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same reason as index.html: the faces only register once ThemeProvider mounts, and a
         gallery whose whole job is judging type must not be judged in the fallback stack.
         crossorigin is required on a font preload or the file is fetched twice. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/lama/LamaSans-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/lama/LamaSans-Bold.woff2"
      crossorigin
    />
    <title>Touch Padel Operator — surface gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery.tsx"></script>
  </body>
</html>
