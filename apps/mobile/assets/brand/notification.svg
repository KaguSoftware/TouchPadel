<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android notification (status-bar) icon - 96x96, transparent.

  Android renders this as an alpha mask tinted with the notification colour
  (app.config.ts: expo-notifications plugin, `color: '#3360AB'`), so it must be
  WHITE ON TRANSPARENT; any other colour comes out as a grey blob. The ball's
  three segments, seams open, at ~92% of the box - the status bar draws it at
  24 dp so the gaps have to be generous.

  Rendered to ../notification-icon.png by scripts/make-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <svg x="4" y="4" width="88" height="88" viewBox="7.47 0 7.06 7.03">
    <path fill="#FFFFFF" d="M7.6 4.28C7.47 3.71 7.48 3.11 7.66 2.5C8.01 1.37 8.89 0.53 9.94 0.2C10.22 0.82 10.28 1.54 10.07 2.23C9.72 3.39 8.72 4.17 7.6 4.28"/>
    <path fill="#FFFFFF" d="M11.33 6.99C10.89 7.03 10.43 6.99 9.98 6.86C8.94 6.53 8.15 5.77 7.77 4.83C9.07 4.65 10.21 3.73 10.61 2.4C10.86 1.61 10.8 0.79 10.5 0.07C10.99-0 11.5 0.03 12.01 0.19C13.1 0.52 13.91 1.34 14.27 2.33C12.91 2.46 11.68 3.39 11.26 4.78C11.03 5.53 11.07 6.3 11.33 6.99"/>
    <path fill="#FFFFFF" d="M14.32 4.53C13.97 5.73 13.02 6.58 11.9 6.88C11.65 6.28 11.6 5.61 11.8 4.94C12.16 3.74 13.24 2.95 14.42 2.88C14.52 3.41 14.49 3.98 14.32 4.53"/>
