  Same ball as icon.svg, but scaled to ~58% of the canvas so it sits inside
  Android's safe zone (the inner 66 dp of the 108 dp canvas): every launcher
  mask - circle, squircle, rounded square - keeps the whole ball. The solid
  Touch Blue behind it is `android.adaptiveIcon.backgroundColor` in
  app.config.ts, not part of this file.

  Rendered to ../adaptive-icon.png by scripts/make-icons.mjs.
-->
