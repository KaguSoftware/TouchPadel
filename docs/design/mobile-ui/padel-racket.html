    <three-d-stage name="padel-racket" background="#f4f1ea"></three-d-stage>
    <script src="./three-d-stage.js"></script>
    <script type="module">
      const stage = document.querySelector('three-d-stage');
      const { THREE } = await stage.ready;

      const mat = (name, color, roughness, metalness = 0.05) => {
        const m = new THREE.MeshStandardMaterial({ color, roughness, metalness });
        m.name = name;
        return m;
      };
      const frameBlue = mat('frame_blue', 0x2b4f94, 0.5);
      const faceBlue = mat('face_blue', 0x3e63ad, 0.6);
      const skyBlue = mat('sky_blue', 0x6ec6ea, 0.45);
      const gripGreen = mat('grip_green', 0x8fc65b, 0.85, 0);
      const navy = mat('navy', 0x1f3a70, 0.5);

      const rad = (d) => (d * Math.PI) / 180;
      const HEAD = { x: 0, y: 0.32, r: 0.13 }; // head centre / outer radius (m)
      const T = 0.038; // frame thickness
      const model = new THREE.Group();
      model.name = 'body';

      // ---- Frame: outer teardrop outline with face opening + throat window ----
      const outer = new THREE.Shape();
      // teardrop: round crown, sides run tangentially down into the neck
      const A = 20; // degrees below horizontal where the crown meets the straight sides
      const px = HEAD.r * Math.cos(rad(A)),
        py = HEAD.y - HEAD.r * Math.sin(rad(A));
      outer.absarc(HEAD.x, HEAD.y, HEAD.r, rad(-A), rad(180 + A), false);
      const NW = 0.018; // half-width of the neck/handle core (≈ frame half-thickness → near-round section)
      outer.bezierCurveTo(-0.098, 0.205, -NW, 0.165, -NW, 0.125);
      outer.lineTo(-NW, 0.108);
      outer.lineTo(NW, 0.108);
      outer.lineTo(NW, 0.125);
      outer.bezierCurveTo(NW, 0.165, 0.098, 0.205, px, py);
      outer.closePath();

      // face opening: matching teardrop, closed above the throat window
      function teardrop(r, a, bottomY, neckW) {
        const p = new THREE.Path();
        const lx = -r * Math.cos(rad(a)),
          ly = HEAD.y - r * Math.sin(rad(a));
        p.absarc(HEAD.x, HEAD.y, r, rad(-a), rad(180 + a), false);
        p.bezierCurveTo(lx + 0.02, ly - 0.045, -neckW, bottomY, 0, bottomY);
        p.bezierCurveTo(neckW, bottomY, -lx - 0.02, ly - 0.045, -lx, ly);
        p.closePath();
        return p;
      }
      const faceOpening = teardrop(0.116, 25, 0.204, 0.05);
      outer.holes.push(faceOpening);

      const throat = new THREE.Path();
      throat.moveTo(-0.046, 0.188);
      throat.lineTo(0.046, 0.188);
      throat.quadraticCurveTo(0.016, 0.168, 0, 0.156);
      throat.quadraticCurveTo(-0.016, 0.168, -0.046, 0.188);
      throat.closePath();
      outer.holes.push(throat);

      const frameGeo = new THREE.ExtrudeGeometry(outer, {
        depth: T - 0.008,
        bevelEnabled: true,
        bevelThickness: 0.004,
        bevelSize: 0.004,
        bevelOffset: -0.004,
        bevelSegments: 4,
        curveSegments: 48,
      });
      frameGeo.translate(0, 0, -(T - 0.008) / 2);
      const frame = new THREE.Mesh(frameGeo, frameBlue);
      frame.name = 'frame';
      model.add(frame);

      // ---- Face plate with perforations ----
      const face = new THREE.Shape();
      const fp = teardrop(0.1195, 25, 0.2, 0.05);
      face.curves = fp.curves;
      face.autoClose = true;
      const HOLE_R = 0.0065;
      const FACE_SEG = 24; // the plate's tessellation — the outline's, and every hole's

      // Thirty holes in six rows of 4, 5, 6, 6, 5, 4 — the owner's own count ("first row 4 then
      // 5 then 6 then 6 then 5 then 4 and thats it no more rows", 2026-09-05), written down
      // rather than derived, because it is the spec and not what a clipped lattice happens to
      // leave. NOT the sticker sheet: docs/brand/stickers-5cm.pdf p8 draws 32 dots in rows of
      // 4, 5, 6, 6, 6, 5 with its rows further apart than its columns, so checking this pattern
      // against that page will disagree, and the page is not the authority. 30 mm across a row, 26 mm
      // between rows (30 · sin 60°), and the six straddle the sweet spot at ± 13, 39 and 65 mm
      // rather than one sitting on it: an even count is what makes the pattern mirror. It also
      // forces the stagger — rows of 4 and 6 need the half-step to stay centred on x = 0 and
      // rows of 5 do not — so it runs half, none, half | half, none, half, and the two 6-rows
      // sit directly above one another instead of interleaving.
      const ROWS = [4, 5, 6, 6, 5, 4];
      const HOLES = [];
      ROWS.forEach((n, i) => {
        const y = HEAD.y + (i - 2.5) * 0.026;
        for (let j = 0; j < n; j++) HOLES.push([HEAD.x + (j - (n - 1) / 2) * 0.03, y]);
      });
      // Cut, not filled: the plate is drilled and the background shows through. apps/mobile's
      // port plugs the same thirty with white instead — on the court a hole would show turf, and
      // the brand's flat racket draws its dots white. Same lattice, the other technique.
      for (const [x, y] of HOLES) {
        const h = new THREE.Path();
        h.absarc(x, y, HOLE_R, 0, Math.PI * 2, true);
        face.holes.push(h);
      }
      const FT = T - 0.006;
      const faceGeo = new THREE.ExtrudeGeometry(face, {
        depth: FT - 0.002,
        bevelEnabled: true,
        bevelThickness: 0.001,
        bevelSize: 0.001,
        bevelOffset: -0.001,
        bevelSegments: 2,
        curveSegments: FACE_SEG,
      });
      faceGeo.translate(0, 0, -(FT - 0.002) / 2);
      const facePlate = new THREE.Mesh(faceGeo, faceBlue);
      facePlate.name = 'face';
      model.add(facePlate);

      // white halo, the same twelve shapes stroke-expanded and painted underneath, and a racket
      // face is not a sticker.

      // cut out of it; the greens and creams are painted into those windows, and one eye is
      // painted back over the felt. Measured rather than assumed: paths 25-33 each cover part of
      // the navy and none touches another, 34 touches nothing, and only 35 lands on a green.

      // lifted this much over the one beneath, and the topmost still sits under the plugs the
      // port stands in its holes (0.0165) as well as under this file's own frame.

        'M 31.49 100.61 C 28.95 99.5 27.01 97.9 25.03 96.1 C 24.46 89.23 22.17 82.73 17.77 77.41 C 16.85 76.29 16.02 75.12 14.96 74.17 L 11.74 71.28 C 9.71 69.46 7.29 68.22 5.07 66.68 C 4.25 64.5 4.46 62.32 4.89 60.06 C 7.21 61.16 9.37 62.01 11.39 63.39 L 14.71 65.66 C 19.19 68.71 23.16 73.6 26.14 78.14 C 27.82 80.7 28.71 83.57 29.82 86.43 C 31.15 89.84 31.44 93.47 31.55 97.11 C 31.58 98.26 31.92 99.32 31.49 100.61',
        // the seam, a chip at the smile's right tip
        'M 103.42 68.8 C 100.89 68.85 95.77 68.87 93.74 68.25 C 94.33 66.28 94.07 64.37 93.86 62.1 C 97.41 62.41 100.84 62.44 104.55 62.36 C 104.82 64.13 103.5 66.52 103.42 68.8',
        // the seam, a speck below the smile's right tip
        'M 92.3 68.06 C 91.4 68.1 90.45 68.2 89.74 67.62 C 89.42 67.35 89.87 66.18 90.28 66.25 C 91.1 66.71 91.67 67.55 92.3 68.06',
      ];

      const SMILEY_INK_TOP_PATHS = [
        // the left eye, painted back over the felt
        'M 37.47 48.12 C 35.41 46.91 34.23 42.15 34.25 39.64 L 34.29 31.9 C 34.3 30.18 35.75 24.37 38.61 24.32 C 44.6 26.78 43.98 31.42 44.53 36.05 C 44.99 39.84 44.05 43.24 42.12 46.48 C 41.16 48.11 39.42 49.26 37.47 48.12',
      ];

      // One THREE.Path per subpath. Not a general SVG parser on purpose: the extraction holds
      // only the absolute M, L, C and Z, so anything else means the artwork was re-exported and
      // is an error, not something to approximate. Two of the strings end on a lone trailing M —
      // a moveto that draws nothing — which is dropped rather than emitted as an empty path.
      function parseSvgPath(d) {
        const t = d.match(/[A-Za-z]|-?\d*\.?\d+/g) ?? [];
        const paths = [];
        let p = null,
          i = 0;
        const n = () => parseFloat(t[i++]);
        const num = () => i < t.length && !/[A-Za-z]/.test(t[i]);
        const flush = () => {
          if (p && p.curves.length) paths.push(p);
          p = null;
        };
        while (i < t.length) {
          const c = t[i++];
          if (c === 'M') {
            flush();
            p = new THREE.Path();
            p.moveTo(n(), n());
            while (num()) p.lineTo(n(), n());
          } else if (c === 'L') {
            do p.lineTo(n(), n());
            while (num());
          } else if (c === 'C') {
            do p.bezierCurveTo(n(), n(), n(), n(), n(), n());
            while (num());
          }
          // three leaves the pen where the last curve ended; SVG puts it back on the start
          else if (c === 'Z') {
            p.closePath();
            p.currentPoint.copy(p.curves[0].getPoint(0));
          } else throw new Error('padel-racket: unsupported path command "' + c + '"');
        }
        flush();
        return paths;
      }

      // Subpaths → filled shapes by CONTAINMENT DEPTH: even depth is ink and becomes a Shape,
      // odd is a counter and becomes a hole of its smallest container one level up. This artwork
      // has exactly two — inside the bowl of the "d" and the loop of the "P" — which fill in as
      // blobs without it. Containment is VOTED over a whole flattened outline rather than sampled
      // at a point: the letters are drawn as unions of overlapping outlines (the stem of the "u"
      // laid across its bowl), so a lone sample lands inside a neighbour that does not contain
      // it. A true counter scores 1.000 here, the worst overlap 0.232.
      function groupSubpaths(subpaths) {
        const polys = subpaths.map((p) => p.getPoints(16));
        const inside = (q, poly) => {
          let hit = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const a = poly[i],
              b = poly[j];
            if (a.y > q.y !== b.y > q.y && q.x < ((b.x - a.x) * (q.y - a.y)) / (b.y - a.y) + a.x)
              hit = !hit;
          }
          return hit;
        };
        const within = (inner, outer) =>
          inner.filter((q) => inside(q, outer)).length > inner.length / 2;
        const area = (poly) => {
          let s = 0;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++)
            s += poly[j].x * poly[i].y - poly[i].x * poly[j].y;
          return Math.abs(s) / 2;
        };
        const owners = polys.map((_, i) =>
          polys.map((_p, j) => j).filter((j) => j !== i && within(polys[i], polys[j])),
        );
        const depth = owners.map((o) => o.length);
        const shapes = new Map();
        subpaths.forEach((p, i) => {
          if (depth[i] % 2) return;
          const s = new THREE.Shape();
          s.curves = p.curves.slice();
          s.currentPoint.copy(p.currentPoint);
          shapes.set(i, s);
        });
        subpaths.forEach((p, i) => {
          if (!(depth[i] % 2)) return;
          const host = owners[i]
            .filter((j) => depth[j] === depth[i] - 1)
            .sort((a, b) => area(polys[a]) - area(polys[b]))[0];
          shapes.get(host).holes.push(p);
        });
        return [...shapes.values()];
      }

      // SVG space → three's: centred on the ink's own enclosing circle and y-flipped, which
      // stands the mark upright and puts that circle on (0, 0) at once, then scaled to MARK_R.
      // Rebuilt curve for curve, so the beziers survive the move and LOGO_SEG still owns the
      // smoothness.
      function placeMark(paths, radius) {
        const k = radius / SMILEY_CIRCLE.r;
        const f = (p) =>
          new THREE.Vector2((p.x - SMILEY_CIRCLE.cx) * k, (SMILEY_CIRCLE.cy - p.y) * k);
        return paths.map((path) => {
          const out = new THREE.Path();
          for (const c of path.curves) {
            if (c instanceof THREE.CubicBezierCurve)
              out.curves.push(new THREE.CubicBezierCurve(f(c.v0), f(c.v1), f(c.v2), f(c.v3)));
            else if (c instanceof THREE.LineCurve)
              out.curves.push(new THREE.LineCurve(f(c.v1), f(c.v2)));
            else throw new Error('padel-racket: cannot move a ' + c.type);
          }
          out.currentPoint.copy(f(path.currentPoint));
          return out;
        });
      }

      // THE DOTS GO OVER THE MARK, AND HERE A DOT IS A HOLE. The port stands a white plug in each
      // perforation and puts the decal 0.4 mm behind the caps; a void cannot be put behind
      // anything, so this file drills the sheet instead — the lattice punches through the mark
      // exactly as it punches through the plate, and you see the background through it. Same read
      // as the port's, reached this file's own way.
      //
      // It went the other way for exactly one day, when the mark was the wordmark: 13 of the 30
      // holes have their rims on ink at the size it was drawn, and a word read through 13 holes is
      // not a word ("the racket dots don't pierce through the logo", owner, 2026-09-05). The
      // smiley needs no such protection and was chosen partly because of it — "we could have the
      // dots piercing this no problem" — so drilling is back, which is all a drilled printed plate
      // ever does.
      //
      // Each triangle of the decal is clipped against the same 24-gon the extruder cuts the plate
      // with (FACE_SEG), so the two rims are one polygon and no ink overhangs a hole. Subtracting
      // a convex region from a convex piece goes an edge at a time: what falls outside edge i is
      // finished, what falls inside carries on to i + 1, and what survives all 24 was inside the
      // hole and is dropped. Pieces stay convex, so a fan triangulates them.
      function drill(geo, centres, r, sides) {
        const pos = geo.getAttribute('position');
        const index = geo.getIndex();
        const z = pos.getZ(0); // the decal is flat: one z carries the whole sheet
        const ring = [];
        for (let i = 0; i <= sides; i++)
          ring.push([
            Math.cos((i / sides) * Math.PI * 2) * r,
            Math.sin((i / sides) * Math.PI * 2) * r,
          ]);
        const side = (ax, ay, bx, by, x, y) => (bx - ax) * (y - ay) - (by - ay) * (x - ax);
        const out = [];
        for (let k = 0; k < index.count; k += 3) {
          const a = index.getX(k),
            b = index.getX(k + 1),
            c = index.getX(k + 2);
          let pieces = [
            [pos.getX(a), pos.getY(a), pos.getX(b), pos.getY(b), pos.getX(c), pos.getY(c)],
          ];
          for (const [cx, cy] of centres) {
            const next = [];
            for (const piece of pieces) {
              // one edge of the hole with the whole piece behind it separates the two:
              // pass that piece through WHOLE rather than shattering it on 24 lines
              let clear = false;
              for (let i = 0; i < sides && !clear; i++) {
                const ax = cx + ring[i][0],
                  ay = cy + ring[i][1],
                  bx = cx + ring[i + 1][0],
                  by = cy + ring[i + 1][1];
                clear = true;
                for (let v = 0; v < piece.length && clear; v += 2)
                  clear = side(ax, ay, bx, by, piece[v], piece[v + 1]) <= 0;
              }
              if (clear) {
                next.push(piece);
                continue;
              }
              let rest = piece;
              for (let i = 0; i < sides && rest.length >= 6; i++) {
                const ax = cx + ring[i][0],
                  ay = cy + ring[i][1],
                  bx = cx + ring[i + 1][0],
                  by = cy + ring[i + 1][1];
                const keep = [],
                  carry = [];
                for (let v = 0; v < rest.length; v += 2) {
                  const w = (v + 2) % rest.length;
                  const s0 = side(ax, ay, bx, by, rest[v], rest[v + 1]),
                    s1 = side(ax, ay, bx, by, rest[w], rest[w + 1]);
                  (s0 > 0 ? carry : keep).push(rest[v], rest[v + 1]);
                  if (s0 > 0 !== s1 > 0) {
                    const t = s0 / (s0 - s1);
                    const x = rest[v] + (rest[w] - rest[v]) * t,
                      y = rest[v + 1] + (rest[w + 1] - rest[v + 1]) * t;
                    keep.push(x, y);
                    carry.push(x, y);
                  }
                }
                if (keep.length >= 6) next.push(keep);
                rest = carry;
              }
            }
            pieces = next;
          }
          for (const piece of pieces)
            for (let i = 4; i < piece.length; i += 2)
              out.push(
                piece[0],
                piece[1],
                z,
                piece[i - 2],
                piece[i - 1],
                z,
                piece[i],
                piece[i + 1],
                z,
              );
        }
        const nrm = new Float32Array(out.length);
        for (let i = 2; i < nrm.length; i += 3) nrm[i] = 1; // a flat sheet, facing the camera
        geo.setIndex(null);
        geo.deleteAttribute('uv'); // nothing on this racket samples a texture
        geo.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
        return geo;
      }

      function decal(paths, material, name, layer) {
        const g = new THREE.ShapeGeometry(
          groupSubpaths(placeMark(paths.flatMap(parseSvgPath), MARK_R)),
          LOGO_SEG,
        );
        // ShapeGeometry emits one group per shape, each with its own materialIndex, and the mesh
        // carries a single material: the felt's 6 shapes cost a draw call each and buy nothing.
        // Clearing them is also what makes the drill safe — those ranges would otherwise index a
        // buffer that no longer exists.
        g.clearGroups();
        g.translate(HEAD.x, HEAD.y, DECAL_Z + layer * DECAL_LAYER);
        const m = new THREE.Mesh(drill(g, HOLES, HOLE_R, FACE_SEG), material);
        m.name = name;
        model.add(m);
      }
      // THREE COLOURS THE RACKET ALREADY WEARS.
      //
      // The sticker is drawn navy, felt green and cream on white paper. Two of those survive as
      // themselves and one cannot: the artwork's navy is (53, 78, 168) and a racket plate is a
      // blue of about the same weight, so taken literally the ring, the eyes and the smile would
      // dissolve into the face and the mark would read as a green blob. The ink is therefore each
      // file's own darkest blue — `navy` here, the FRAME's colour in the port, which is darker
      // still because the two files keep different palettes and always have.
      //
      // The felt is the grip's green, a shade off the artwork's own, and the seams are white:
      // both the paper the brand prints this ball on and the colour of the dots now punched
      // through it. That collision sank the wordmark this mark replaced — mark and lattice fused
      // into one white mass — and is right here, because a tennis ball's seams ARE white and the
      // navy outlines them either way.
      //
      // The order is the artwork's, and it is not decoration: the navy is a disc with the felt's
      // windows cut out of it, so it goes down FIRST and everything else is painted into it.
      const logoWhite = mat('logo_white', 0xffffff, 0.6);
      decal(SMILEY_INK_PATHS, navy, 'mark_ink', 0);
      decal(SMILEY_BALL_PATHS, gripGreen, 'mark_ball', 1);
      // Felt and seams never touch each other — only the navy under both — so they share a layer.
      decal(SMILEY_SEAM_PATHS, logoWhite, 'mark_seam', 1);
      decal(SMILEY_INK_TOP_PATHS, navy, 'mark_ink_top', 2);

      // ---- Cartoon highlight bands on the rim (front + back) ----
      function arcBand(name, a0, a1, rIn, rOut, z) {
        const s = new THREE.Shape();
        s.absarc(HEAD.x, HEAD.y, rOut, rad(a0), rad(a1), false);
        s.absarc(HEAD.x, HEAD.y, rIn, rad(a1), rad(a0), true);
        s.closePath();
        const g = new THREE.ExtrudeGeometry(s, {
          depth: 0.0012,
          bevelEnabled: false,
          curveSegments: 40,
        });
        g.translate(0, 0, z);
        const m = new THREE.Mesh(g, skyBlue);
        m.name = name;
        return m;
      }
      const zFront = T / 2 + 0.0003,
        zBack = -T / 2 - 0.0015;
      model.add(arcBand('highlight_front', 100, 160, 0.1205, 0.1255, zFront));
      model.add(arcBand('highlight_back', 20, 80, 0.1205, 0.1255, zBack));

      // ---- Handle: lofted collar morphs the slab section into a circle, then a round grip ----
      const R = 0.0195; // grip radius
      function loft(name, material, yTop, yBot, top, bot, around = 64, along = 24) {
        const pos = [],
          idx = [];
        const smooth = (t) => t * t * (3 - 2 * t);
        for (let i = 0; i <= along; i++) {
          const t = smooth(i / along),
            y = yTop + (yBot - yTop) * (i / along);
          const a = top.a + (bot.a - top.a) * t,
            b = top.b + (bot.b - top.b) * t,
            n = top.n + (bot.n - top.n) * t;
          for (let j = 0; j <= around; j++) {
            const th = (j / around) * Math.PI * 2,
              c = Math.cos(th),
              s = Math.sin(th);
            pos.push(
              a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n),
              y,
              b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n),
            );
          }
        }
        for (let i = 0; i < along; i++)
          for (let j = 0; j < around; j++) {
            const p = i * (around + 1) + j,
              q = p + around + 1;
            idx.push(p, q, p + 1, q, q + 1, p + 1);
          }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, material);
        m.name = name;
        return m;
      }
      // top section hugs the beveled slab (18 × 19 mm half-sizes), bottom is a true circle
      model.add(
        loft(
          'collar',
          navy,
          0.13,
          0.1,
          { a: NW + 0.0005, b: T / 2 + 0.0005, n: 10 },
          { a: R, b: R, n: 2 },
        ),
      );
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.09, 48), gripGreen);
      grip.name = 'grip';
      grip.position.y = 0.012 + 0.045;
      model.add(grip);
      for (let i = 0; i < 4; i++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(R - 0.0015, 0.0034, 14, 48), gripGreen);
        ring.name = 'grip_wrap_' + (i + 1);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.028 + i * 0.022;
        model.add(ring);
      }
      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(R + 0.0015, R + 0.0005, 0.012, 48),
        navy,
      );
      cap.name = 'butt_cap';
      cap.position.y = 0.007;
      model.add(cap);
      const capEnd = new THREE.Mesh(
        new THREE.SphereGeometry(R + 0.0015, 48, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
        navy,
      );
      capEnd.name = 'butt_cap_end';
      capEnd.scale.y = 0.3;
      capEnd.position.y = 0.0064;
      model.add(capEnd);

      // ---- Hierarchy: root > swing_pivot (animated, origin at the grip) > body ----
      const PIVOT_Y = 0.05;
      model.position.y = -PIVOT_Y;
      // one-handed forehand hold: handle points to the player's side (+X), head out to -X,
      // slightly above horizontal, face leaning a touch forward
      const hold = new THREE.Group();
      hold.name = 'hand_hold';
      hold.rotation.set(-0.08, 0, 0.75, 'YXZ');
      hold.add(model);
      const pivot = new THREE.Group();
      pivot.name = 'swing_pivot';
      pivot.add(hold);
      const root = new THREE.Group();
      root.name = 'padel_racket';
      root.position.y = PIVOT_Y + 0.15;
      root.add(pivot);

      // ---- Swing clip: rest → backswing → contact → follow-through → rest (loops) ----
      // keys: [time, tiltX, turnY, liftZ, posX, posY, posZ]
      // The hand travels on a forehand arc around the player (behind-right → forward-left),
      // -Z is forward. turnY sweeps the head around the body; liftZ goes low-to-high through contact.
      const keys = [
        [0.0, 0.03, -0.35, -0.06, 0.1, 0.0, 0.16],
        [0.45, 0.05, -0.55, -0.14, 0.14, 0.02, 0.26],
        [0.62, 0.05, -0.52, -0.14, 0.13, 0.01, 0.26],
        [0.78, 0.02, -0.25, -0.06, 0.06, 0.0, 0.08],
        [0.9, 0.0, 0.05, 0.04, -0.02, 0.02, -0.1],
        [1.1, -0.04, 0.35, 0.16, -0.1, 0.08, -0.26],
        [1.35, -0.04, 0.4, 0.2, -0.12, 0.11, -0.3],
        [1.8, 0.0, 0.05, 0.08, -0.03, 0.05, -0.1],
        [2.2, 0.03, -0.35, -0.06, 0.1, 0.0, 0.16],
      ];
      const times = [],
        quats = [],
        pos = [],
        q = new THREE.Quaternion(),
        e = new THREE.Euler();
      for (const [t, x, y0, z, px0, py_, pz_] of keys) {
        const y = -y0,
          px_ = -px0; // mirrored: path sweeps to the right
        times.push(t);
        q.setFromEuler(e.set(x, y, z, 'YXZ'));
        quats.push(q.x, q.y, q.z, q.w);
        pos.push(px_, py_, pz_);
      }
      const rotTrack = new THREE.QuaternionKeyframeTrack('swing_pivot.quaternion', times, quats);
      const posTrack = new THREE.VectorKeyframeTrack(
        'swing_pivot.position',
        times,
        pos,
        THREE.InterpolateSmooth,
      );
      const swing = new THREE.AnimationClip('swing', 2.2, [rotTrack, posTrack]);
      root.animations = [swing];

      // ---- Preview the clip in the stage ----
      const mixer = new THREE.AnimationMixer(root);
      mixer.clipAction(swing).play();
      const timer = new THREE.Timer();
      const baseLoop = stage._loop;
      stage._loop = () => {
        timer.update();
        mixer.update(timer.getDelta());
        baseLoop();
      };
      stage._renderer.setAnimationLoop(stage._loop);

      stage.setObject(root);
      // widen the framing so the travelling swing stays in view
      stage._camera.position
        .sub(stage._controls.target)
        .multiplyScalar(1.6)
        .add(stage._controls.target);
      stage._controls.update();
    </script>
  </body>
</html>
