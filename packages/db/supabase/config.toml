# Touch Padel — local Supabase configuration.
#
# IMPORTANT: pg_cron must be enabled on the database. The Supabase local image ships
# pg_cron preloaded; on the hosted project enable it under Database > Extensions
# before applying migration 0017 (degraded-mode sweeps + hold expiry are pg_cron jobs).
#
# Run everything through the workspace devDependency binary:
#   pnpm --filter @touch/db db:start / db:reset / db:types

project_id = "touchpadel"

[api]
enabled = true
port = 54321
# `app` is exposed so SECURITY DEFINER RPCs are callable via supabase-js
# (`client.schema('app').rpc(...)`) and included in generated types.
schemas = ["public", "app", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Local mail-catcher: email verification flows in dev land here.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Cafe menu media (item/category photos, hero image/video). Public read; staff
# writes are gated by the storage.objects policies in migration 0031 (which
# also upserts the same bucket on hosted). objects_path seeds local fixture
# placeholders on `supabase start` / `db reset`: the directory MUST exist and
# every file in it is uploaded and must pass allowed_mime_types (no .gitkeep —
# an empty file sniffs as text/plain and fails the seed).
[storage.buckets.menu-media]
public = true
file_size_limit = "25MiB"
allowed_mime_types = ["image/webp", "image/jpeg", "image/png", "video/mp4", "video/webm"]
objects_path = "./buckets/menu-media"

[auth]
enabled = true
site_url = "http://localhost:3000"
# The mobile app's auth emails redirect to its custom scheme; a target that is
# not listed here is silently replaced by site_url, which on a phone means the
# browser lands on a localhost port nothing is serving. The HOSTED project needs
# the same two entries under Auth -> URL Configuration — this file only governs
# `supabase start`.
additional_redirect_urls = [
  "https://localhost:3000",
  "touchpadel://verify-email",
  "touchpadel://reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Cafe guest sessions are Supabase ANONYMOUS sign-ins (design-data.md §1.5).
enable_anonymous_sign_ins = true

[auth.rate_limit]
# Every cafe guest is an anonymous sign-in; the GoTrue default (30/hr/IP) is far
# too low for a venue where many phones share one WAN IP — and it throttles the
# concurrency test suite. Revisit before production handover (SEC gate 5).
anonymous_users = 300

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Social sign-in -- VENDOR ADDITION 2026-09-01 (SOW L259-260 excludes it; the
# owner chose to add it; email/password stays the contractual path). The mobile
# app signs in NATIVELY (Sign in with Apple on iOS, Google Sign-In on iOS and
# Android) and hands the id token to supabase.auth.signInWithIdToken. GoTrue
# then verifies the token's signature against Apple's / Google's JWKS and
# requires its `aud` to be one of the client ids listed below. Hence:
#   * `supabase start` needs INTERNET for these two flows (the JWKS fetch);
#     everything else stays offline.
#   * client_id values are PUBLIC identifiers -- they ship inside the app
#     bundle -- so commit the real ones: replace the REPLACE_* placeholders as
#     soon as the Google Cloud OAuth clients exist.
#   * `secret` is used only by the browser OAuth code exchange, which no Touch
#     client uses; the CLI rejects an empty value for an enabled provider, so
#     a documented dummy satisfies it. Never paste the real Apple key or the
#     Google client secret here.
#   * host.exp.Exponent is Expo Go's bundle id -- DEV ONLY, so Sign in with
#     Apple works inside Expo Go. It must be REMOVED from the HOSTED list
#     before store release.
#   * Android has no entry on purpose: Google id tokens minted on Android carry
#     the WEB client id as `aud`, so the web id covers it.
#   * skip_nonce_check stays false. It is a fallback ONLY if Google's iOS SDK
#     turns out to ignore the nonce the app passes, and flipping it needs
#     security sign-off -- the nonce is what stops a captured token replaying.
# The HOSTED project needs the same client-id lists under Auth -> Providers;
# this file only governs `supabase start`. Config changes here need
# `supabase stop && supabase start` (a `db reset` alone does not reload GoTrue).
[auth.external.apple]
enabled = true
client_id = "com.kagu.touchpadel,host.exp.Exponent"
secret = "local-dev-unused"
skip_nonce_check = false

[auth.external.google]
enabled = true
client_id = "699390054618-egm0m36515stvli0dah67htvge6j88nh.apps.googleusercontent.com,699390054618-hdmsl0sn76i09b9esp7tae2t8ktj77sq.apps.googleusercontent.com"
secret = "local-dev-unused"
skip_nonce_check = false

[analytics]
enabled = false

# Edge functions — verify_jwt declared here so `supabase functions deploy`
# applies it without remembering --no-verify-jwt. Every function is listed: relying
# on the platform default is one silent redeploy away from being wrong (0048).
[functions.telegram-callback]
verify_jwt = false                          # Telegram carries no Supabase JWT; secret_token header is the auth
[functions.telegram-send]
verify_jwt = true                           # pg_net posts with the service-role JWT
[functions.analytics-posthog]
verify_jwt = true
[functions.analytics-insights]
verify_jwt = true
[functions.replay]
verify_jwt = true                           # staff session JWT; the body then re-checks the staff row
[functions.send-push]
verify_jwt = true                           # cron/pg_net posts with the service-role JWT
[functions.staff-admin]
verify_jwt = true                           # owner session JWT; the body re-checks the staff row
[functions.desk-customer-create]
verify_jwt = true                           # desk session JWT; the body re-checks the staff row (court_desk/manager/owner)
